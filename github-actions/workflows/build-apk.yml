name: Build APK
on:
  workflow_dispatch:
    inputs:
      app_id: { description: 'App ID', required: true, type: string }
      app_code: { description: 'App Code', required: true, type: string }
      app_name: { description: 'App Name', required: true, type: string }
      app_url: { description: 'Website URL', required: true, type: string }
      splash_duration: { description: 'Splash ms', required: false, default: '2000', type: string }
      splash_color: { description: 'Splash Color', required: false, default: '#0A1A2F', type: string }
      splash_logo: { description: 'Splash Logo URL', required: false, type: string }
      app_icon: { description: 'App Icon URL', required: false, type: string }
      external_links: { description: '1/0', required: false, default: '1', type: string }
      allow_download: { description: '1/0', required: false, default: '1', type: string }
      allow_upload: { description: '1/0', required: false, default: '1', type: string }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Update Config.java from inputs
        run: |
          FILE="android/app/src/main/java/com/webview/builder/Config.java"
          python3 github-actions/scripts/update_config.py "$FILE" "${{ inputs.app_url }}" "${{ inputs.app_name }}" "${{ inputs.splash_duration }}" "${{ inputs.splash_color }}" "${{ inputs.splash_logo }}" "${{ inputs.external_links }}" "${{ inputs.allow_download }}" "${{ inputs.allow_upload }}"
      - name: Download Splash Logo + Icon
        run: python3 github-actions/scripts/download_assets.py "${{ inputs.splash_logo }}" "${{ inputs.app_icon }}" || echo "No assets"
      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew || true
          ./gradlew assembleRelease --stacktrace || ./gradlew assembleDebug
      - name: Rename APK
        run: |
          mkdir -p output
          APK=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          cp "$APK" "output/${{ inputs.app_code }}-${{ inputs.app_name }}.apk"
          ls -lh output/
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with: { name: app-${{ inputs.app_code }}, path: output/*.apk, retention-days: 30 }
