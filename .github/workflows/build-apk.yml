name: Build APK

"on":
  workflow_dispatch:
    inputs:
      app_id:
        description: 'App ID'
        required: true
        type: string
      app_code:
        description: 'App Code'
        required: true
        type: string
      app_name:
        description: 'App Name'
        required: true
        type: string
      app_url:
        description: 'Website URL'
        required: true
        type: string
      splash_duration:
        description: 'Splash ms'
        required: false
        default: '2000'
        type: string
      splash_color:
        description: 'Splash Color'
        required: false
        default: '#0A1A2F'
        type: string
      splash_logo:
        description: 'Splash Logo URL'
        required: false
        type: string
      app_icon:
        description: 'App Icon URL'
        required: false
        type: string
      external_links:
        description: '1/0'
        required: false
        default: '1'
        type: string
      allow_download:
        description: '1/0'
        required: false
        default: '1'
        type: string
      allow_upload:
        description: '1/0'
        required: false
        default: '1'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Show Android SDK already installed
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls $ANDROID_HOME
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Show files
        run: |
          ls -R android | head -n 100
          cat android/app/src/main/java/com/webview/builder/Config.java

      - name: Update Config
        run: |
          FILE="android/app/src/main/java/com/webview/builder/Config.java"
          python3 .github/scripts/update_config.py "$FILE" "${{ inputs.app_url }}" "${{ inputs.app_name }}" "${{ inputs.splash_duration }}" "${{ inputs.splash_color }}" "${{ inputs.splash_logo }}" "${{ inputs.external_links }}" "${{ inputs.allow_download }}" "${{ inputs.allow_upload }}"
          cat "$FILE"

      - name: Download assets
        run: python3 .github/scripts/download_assets.py "${{ inputs.splash_logo }}" "${{ inputs.app_icon }}" || echo "No assets"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          cd android
          gradle assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p output
          APK=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found APK $APK"
          cp "$APK" "output/${{ inputs.app_code }}-${{ inputs.app_name }}.apk"
          ls -lh output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ inputs.app_code }}
          path: output/
          retention-days: 30
